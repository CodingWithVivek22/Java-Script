<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard event demo</title>

    <style>

    </style>
</head>

<body>
    <h1>Keyboard Event Demo</h1>

    <p>Click the input box and press keys.</p>

    <input type="text" placeholder="Type here..." class="input">


    <p class="para">Press a Key...</p>


    <script>

        let text = document.querySelector(".input");
        let target = document.querySelector(".para");

        function key1(event) {
            target.innerHTML = `KeyDown: ${event.key} <br>code: ${event.code}`;
        }

        function key2(event) {
            target.innerHTML = `KeyUp: ${event.key} <br>
            code: ${event.code}`;
        }
        text.addEventListener("keydown", key1);
        text.addEventListener("keyup", key2);
    </script>
</body>

</html>
