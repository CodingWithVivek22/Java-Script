<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>

<body>

    <h1 class="main-heading">DOM Manipulation</h1>

    <script>

        // accessing
        let h1 = document.querySelector(".main-heading");
        console.log(h1.innerText);

        // updating the inner text
        h1.innerHTML = "React";
        console.log(h1.innerText);

        // style
        // h1.style.color = "red";
        // h1.style.fontSize = "100px";
        // h1.style.backgroundColor = "blue";
        // h1.style.padding = "50px";

        // cssText
        h1.style.cssText = "color : blue; font-size: 50px; background-color : orange"

    </script>
</body>

</html>
